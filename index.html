<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sensi — Find Your Perfect Sensitivity</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="src/style.css" />
</head>
<body>

  <!-- NAV -->
  <nav id="nav">
    <a href="/" class="nav-logo" id="nav-home">
      <div class="nav-logo-icon">🎯</div>
      sensi
    </a>
    <ul class="nav-links">
      <li><a href="#how">Comment ça marche</a></li>
      <li><a href="#" id="nav-test-link">Le test</a></li>
    </ul>
    <div class="nav-actions">
      <button class="btn btn-primary" id="nav-cta">Commencer →</button>
    </div>
  </nav>

  <!-- SPA root -->
  <div id="app"></div>

  <script type="module" src="src/app.js"></script>
  <script>
    // Nav wiring (outside the module for simplicity)
    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('nav-home')?.addEventListener('click', (e) => {
        e.preventDefault();
        window._sensiNavigate?.('/');
      });
      document.getElementById('nav-cta')?.addEventListener('click', () => {
        window._sensiNavigate?.('/setup');
      });
      document.getElementById('nav-test-link')?.addEventListener('click', (e) => {
        e.preventDefault();
        window._sensiNavigate?.('/setup');
      });
    });
  </script>
</body>
</html>
